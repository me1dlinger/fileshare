<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件共享</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --bg: #ffffff;
  --bg2: #f8fafc;
  --bg3: #f1f5f9;
  --text: #1e293b;
  --text2: #64748b;
  --text3: #94a3b8;
  --border: #e2e8f0;
  --primary: #3b82f6;
  --primary-light: #dbeafe;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
  --success: #22c55e;
  --danger: #ef4444;
}
[data-theme="dark"] {
  --bg: #0f172a;
  --bg2: #1e293b;
  --bg3: #334155;
  --text: #f1f5f9;
  --text2: #94a3b8;
  --text3: #64748b;
  --border: #334155;
  --primary-light: #1e3a5f;
  --shadow: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 1.5; background: var(--bg); color: var(--text); }
button { cursor: pointer; border: none; background: none; font: inherit; color: inherit; }

/* ===== Layout ===== */
.app { max-width: 960px; margin: 0 auto; padding: 24px 20px 60px; min-height: 100vh; }

/* ===== Header ===== */
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.header-left { display: flex; align-items: center; gap: 10px; }
.header-left svg { width: 24px; height: 24px; stroke: var(--primary); fill: none; stroke-width: 1.5; }
.header-left h1 { font-size: 20px; font-weight: 600; }
.header-right { display: flex; align-items: center; gap: 8px; }
.header-right .file-count { font-size: 12px; color: var(--text3); }
.theme-btn { width: 34px; height: 34px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
.theme-btn:hover { background: var(--bg3); }
.theme-btn svg { width: 18px; height: 18px; stroke: var(--text2); fill: none; stroke-width: 2; }

/* ===== File Tree ===== */
.tree { }
.tree-item { display: flex; align-items: center; padding: 6px 8px; gap: 8px; border-radius: 6px; transition: background 0.1s; cursor: pointer; min-height: 38px; }
.tree-item:hover { background: var(--bg2); }
.tree-item .arrow { width: 18px; height: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; color: var(--text3); }
.tree-item .arrow svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }
.tree-item.dir.expanded > .arrow { transform: rotate(90deg); }
.tree-item .icon { width: 20px; height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.tree-item .icon svg { width: 18px; height: 18px; }
.tree-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.tree-item .name.no-preview { color: var(--text3); cursor: default; }
.tree-item .size { font-size: 11px; color: var(--text3); flex-shrink: 0; }
.tree-item .badge { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: var(--bg3); color: var(--text3); flex-shrink: 0; }
.tree-children { margin-left: 20px; }
.tree-children.collapsed { display: none; }

/* ===== Modal Overlay ===== */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 24px; animation: fadeIn 0.15s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--bg); border-radius: 12px; width: 100%; max-width: 900px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); overflow: hidden; }
.modal-header { display: flex; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 12px; }
.modal-header .modal-title { font-size: 14px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.modal-header .modal-tabs { display: flex; gap: 0; }
.modal-header .modal-tab { padding: 4px 12px; font-size: 12px; border-radius: 4px; color: var(--text2); cursor: pointer; transition: all 0.15s; }
.modal-header .modal-tab.active { background: var(--primary); color: #fff; }
.modal-close { width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s; }
.modal-close:hover { background: var(--bg3); }
.modal-close svg { width: 18px; height: 18px; stroke: var(--text2); fill: none; stroke-width: 2; }
.modal-body { flex: 1; overflow: auto; padding: 20px 24px; }
.modal-body img { max-width: 100%; border-radius: var(--radius); display: block; margin: 0 auto; }
.modal-body audio { width: 100%; max-width: 500px; display: block; margin: 20px auto; outline: none; }
.modal-body video { width: 100%; max-height: 60vh; border-radius: var(--radius); outline: none; }
.modal-body pre { background: var(--bg3); border-radius: var(--radius); padding: 16px 20px; overflow-x: auto; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace; font-size: 13px; line-height: 1.6; tab-size: 2; white-space: pre-wrap; word-break: break-all; }
.modal-body code { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace; font-size: 13px; }
.modal-body .empty-hint { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; color: var(--text3); gap: 8px; }
.modal-body .empty-hint svg { width: 40px; height: 40px; stroke: var(--text3); fill: none; stroke-width: 1.5; }

/* ===== Markdown rendered ===== */
.md-body { line-height: 1.7; }
.md-body h1 { font-size: 1.6em; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin: 20px 0 12px; }
.md-body h2 { font-size: 1.35em; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin: 18px 0 10px; }
.md-body h3 { font-size: 1.15em; margin: 14px 0 8px; }
.md-body h4, .md-body h5, .md-body h6 { font-size: 1.05em; margin: 10px 0 6px; }
.md-body p { margin: 6px 0; }
.md-body ul, .md-body ol { padding-left: 22px; margin: 6px 0; }
.md-body li { margin: 2px 0; }
.md-body blockquote { border-left: 3px solid var(--primary); padding: 4px 14px; margin: 10px 0; background: var(--bg2); border-radius: 0 4px 4px 0; color: var(--text2); }
.md-body code { background: var(--bg3); padding: 2px 5px; border-radius: 3px; font-size: 0.9em; }
.md-body pre { margin: 10px 0; }
.md-body pre code { background: none; padding: 0; }
.md-body table { border-collapse: collapse; width: 100%; margin: 10px 0; }
.md-body th, .md-body td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; font-size: 13px; }
.md-body th { background: var(--bg2); font-weight: 600; }
.md-body hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.md-body a { color: var(--primary); }
.md-body img { max-width: 100%; border-radius: 4px; }

/* ===== Syntax Highlighting ===== */
.hljs-keyword { color: #7c3aed; }
.hljs-string { color: #059669; }
.hljs-comment { color: #94a3b8; font-style: italic; }
.hljs-number { color: #d97706; }
.hljs-function { color: #2563eb; }
.hljs-type { color: #0891b2; }
.hljs-attr { color: #c026d3; }
.hljs-builtin { color: #dc2626; }
[data-theme="dark"] .hljs-keyword { color: #a78bfa; }
[data-theme="dark"] .hljs-string { color: #34d399; }
[data-theme="dark"] .hljs-comment { color: #64748b; }
[data-theme="dark"] .hljs-number { color: #fbbf24; }
[data-theme="dark"] .hljs-function { color: #60a5fa; }
[data-theme="dark"] .hljs-type { color: #22d3ee; }
[data-theme="dark"] .hljs-attr { color: #e879f9; }
[data-theme="dark"] .hljs-builtin { color: #f87171; }

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ===== Toast ===== */
.web-toast {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-12px);
  background: #1e293b; color: #fff; padding: 8px 22px; border-radius: 8px;
  font-size: 13px; z-index: 2000; pointer-events: none; opacity: 0;
  transition: all 0.2s ease; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
.web-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== Bulk actions bar ===== */
.bulk-bar { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.bulk-bar .bulk-btn { font-size: 12px; padding: 4px 12px; border-radius: 5px; cursor: pointer; border: 1px solid var(--border); background: var(--bg2); color: var(--text); transition: all 0.15s; display: flex; align-items: center; gap: 4px; }
.bulk-bar .bulk-btn:hover { background: var(--bg3); }
.bulk-bar .bulk-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.bulk-bar .bulk-btn.primary:hover { background: #2563eb; }
.bulk-bar .bulk-count { font-size: 12px; color: var(--text2); }

/* Checkbox */
.tree-cb { appearance: none; width: 15px; height: 15px; border: 1.5px solid var(--border); border-radius: 3px; flex-shrink: 0; cursor: pointer; position: relative; margin: 0; }
.tree-cb:checked { background: var(--primary); border-color: var(--primary); }
.tree-cb:checked::after { content: ''; position: absolute; left: 4px; top: 1px; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }

/* Download button per row */
.dl-btn { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border: none; background: none; color: var(--text3); cursor: pointer; border-radius: 4px; flex-shrink: 0; }
.dl-btn:hover { background: var(--bg3); color: var(--primary); }
.dl-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <svg viewBox="0 0 24 24"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6.5l-1.5-2H5a2 2 0 00-2 2z" stroke-width="1.5"/></svg>
      <h1>文件共享</h1>
    </div>
    <div class="header-right">
      <span class="file-count" id="fileCount"></span>
      <button class="theme-btn" id="refreshBtn" title="刷新文件列表">
        <svg viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" fill="none" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
      </button>
      <button class="theme-btn" id="themeBtn" title="切换主题">
        <svg viewBox="0 0 24 24" id="sunIcon"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg viewBox="0 0 24 24" id="moonIcon" style="display:none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </div>

  <!-- Bulk Actions -->
  <div class="bulk-bar" id="bulkBar">
    <input type="checkbox" class="tree-cb" id="selectAllCb" title="Select all files">
    <span class="bulk-count" id="bulkCount">已选择 0</span>
    <button class="bulk-btn primary" id="dlSelectedBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      下载选中
    </button>
    <button class="bulk-btn" id="dlAllBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      全部下载
    </button>
  </div>

  <!-- File Tree -->
  <div class="tree" id="tree"></div>

  <!-- Toast -->
  <div class="web-toast" id="webToast"></div>
</div>

<!-- Preview Modal -->
<div class="modal-overlay" id="modalOverlay" style="display:none">
  <div class="modal" id="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle"></span>
      <div style="flex:1"></div>
      <div class="modal-tabs" id="modalTabs" style="display:none">
        <span class="modal-tab active" data-view="preview">预览</span>
        <span class="modal-tab" data-view="source">源码</span>
      </div>
      <div style="flex:1"></div>
      <a id="modalDownload" href="#" style="font-size:12px;color:var(--primary);text-decoration:none;margin-right:8px;flex-shrink:0">下载</a>
      <button id="modalCopyBtn" style="display:none;font-size:12px;color:var(--primary);background:none;border:none;cursor:pointer;margin-right:8px;flex-shrink:0">复制内容</button>
      <button class="modal-close" id="modalClose">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
// ===== State =====
const params = new URLSearchParams(location.search);
const TOKEN = params.get('token') || '';
const SCOPE_PATH = params.get('path') || '';
let fileTree = [];
let currentFilePath = null;
let currentFileExt = '';
let currentViewMode = 'preview';
let currentRawContent = '';

// ===== Init =====
function init() {
  loadTheme();
  document.getElementById('themeBtn').addEventListener('click', toggleTheme);
  document.getElementById('refreshBtn').addEventListener('click', function() { loadFileList(); showToast('列表已刷新'); });
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
  document.getElementById('modalTabs').addEventListener('click', function(e) {
    if (e.target.classList.contains('modal-tab')) {
      document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
      e.target.classList.add('active');
      currentViewMode = e.target.dataset.view;
      if (currentFilePath) renderPreview(currentRawContent, currentFileExt);
    }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });
  document.getElementById('selectAllCb').addEventListener('click', selectAllFiles);
  document.getElementById('dlSelectedBtn').addEventListener('click', downloadSelected);
  document.getElementById('dlAllBtn').addEventListener('click', downloadAllFiles);
  document.getElementById('modalCopyBtn').addEventListener('click', function() {
    if (currentRawContent) {
      copyToClipboard(currentRawContent).then(() => {
        const btn = document.getElementById('modalCopyBtn');
        btn.textContent = '已复制';
        showToast('内容已复制到剪贴板');
        setTimeout(() => { btn.textContent = '复制内容'; }, 2000);
      }).catch(() => {});
    }
  });
  loadFileList();
}

// ===== Theme =====
function loadTheme() {
  const saved = localStorage.getItem('fs-theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeIcon(saved);
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('fs-theme', next);
  updateThemeIcon(next);
  if (currentFilePath) renderPreview(currentRawContent, currentFileExt);
}
function updateThemeIcon(theme) {
  document.getElementById('sunIcon').style.display = theme === 'dark' ? 'none' : '';
  document.getElementById('moonIcon').style.display = theme === 'dark' ? '' : 'none';
}

// ===== File List =====
async function loadFileList() {
  try {
    let apiUrl = '/api/list?token=' + TOKEN;
    if (SCOPE_PATH) apiUrl += '&path=' + encodeURIComponent(SCOPE_PATH);
    const res = await fetch(apiUrl);
    const data = await res.json();
    fileTree = data.files || [];
    // If scoped, hide header title area (show scope path instead)
    if (data.scoped && data.scopePath) {
      document.querySelector('.header-left h1').textContent = decodeURIComponent(data.scopePath).split(/[/\\]/).filter(Boolean).pop() || 'FileShare';
    }
    renderTree(fileTree, document.getElementById('tree'), 0);
    updateFileCount(fileTree);
  } catch (err) {
    document.getElementById('tree').innerHTML = '<div style="padding:40px;text-align:center;color:var(--text3)">加载文件列表失败</div>';
  }
}
function countFiles(items) {
  let c = 0;
  for (const item of items) {
    if (!item.isDirectory) c++;
    if (item.children) c += countFiles(item.children);
  }
  return c;
}
function updateFileCount(items) {
  document.getElementById('fileCount').textContent = countFiles(items) + ' 个文件';
}

// ===== Previewability =====
const PREVIEW_TEXT_EXTS = ['txt','log','csv','json','xml','yml','yaml','toml','ini','cfg','conf','env','properties'];
const PREVIEW_CODE_EXTS = ['js','mjs','cjs','ts','tsx','jsx','py','java','c','cpp','h','hpp','rs','go','rb','php','swift','kt','kts','scala','dart','lua','r','sql','sh','bash','zsh','bat','cmd','ps1','html','htm','css','scss','less','vue','svelte','svg'];
const PREVIEW_MD_EXTS = ['md','markdown','mdown','mkd'];
const PREVIEW_IMG_EXTS = ['jpg','jpeg','png','gif','webp','bmp','ico'];
const PREVIEW_AUDIO_EXTS = ['mp3','wav','ogg','flac','aac','m4a','wma'];
const PREVIEW_VIDEO_EXTS = ['mp4','webm','mkv','avi','mov','flv','wmv'];

function getFileCategory(ext) {
  if (PREVIEW_MD_EXTS.includes(ext)) return 'markdown';
  if (PREVIEW_CODE_EXTS.includes(ext)) return 'code';
  if (PREVIEW_TEXT_EXTS.includes(ext)) return 'text';
  if (PREVIEW_IMG_EXTS.includes(ext)) return 'image';
  if (PREVIEW_AUDIO_EXTS.includes(ext)) return 'audio';
  if (PREVIEW_VIDEO_EXTS.includes(ext)) return 'video';
  return 'binary';
}

function isPreviewable(ext) {
  return getFileCategory(ext) !== 'binary';
}

// ===== Render Tree =====
function renderTree(items, parent, depth) {
  parent.innerHTML = '';
  for (const item of items) {
    const container = document.createElement('div');
    const row = document.createElement('div');
    const ext = ((item.name || '').split('.').pop() || '').toLowerCase();
    const previewable = item.isDirectory || isPreviewable(ext);

    row.className = 'tree-item' + (item.isDirectory ? ' dir' : '');
    row.style.paddingLeft = (8 + depth * 22) + 'px';

    // Arrow
    if (item.isDirectory && item.children && item.children.length > 0) {
      row.classList.add('expanded');
      const arrow = document.createElement('span');
      arrow.className = 'arrow';
      arrow.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
      row.appendChild(arrow);
    } else {
      const spacer = document.createElement('span');
      spacer.style.cssText = 'width:18px;flex-shrink:0';
      row.appendChild(spacer);
    }

    // Icon
    const icon = document.createElement('span');
    icon.className = 'icon';
    icon.innerHTML = getIconSvg(item);
    row.appendChild(icon);

    // Name
    const name = document.createElement('span');
    name.className = 'name' + (!item.isDirectory && !previewable ? ' no-preview' : '');
    name.textContent = item.name;
    name.title = item.name;
    row.appendChild(name);

    // Non-previewable badge
    if (!item.isDirectory && !previewable) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = '二进制';
      row.appendChild(badge);
    }

    // Download button (directories too)
    if (item.isDirectory) {
      const dlBtn = document.createElement('button');
      dlBtn.className = 'dl-btn';
      dlBtn.title = '下载目录 ' + item.name;
      dlBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
      dlBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        downloadDir(item);
      });
      row.appendChild(dlBtn);
      // Spacer for alignment
      const spacer = document.createElement('span');
      spacer.style.cssText = 'width:39px;flex-shrink:0';
      row.appendChild(spacer);
    } else {
      const dlBtn = document.createElement('button');
      dlBtn.className = 'dl-btn';
      dlBtn.title = '下载 ' + item.name;
      dlBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
      dlBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        downloadFile(item.path, item.name);
      });
      row.appendChild(dlBtn);

      // Checkbox
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'tree-cb';
      cb.dataset.path = item.path;
      cb.dataset.name = item.name;
      cb.addEventListener('click', function(e) { e.stopPropagation(); updateBulkBar(); });
      row.appendChild(cb);
    }

    row.addEventListener('click', function(e) {
      e.stopPropagation();
      if (item.isDirectory) {
        const childDiv = container.querySelector('.tree-children');
        if (childDiv) {
          childDiv.classList.toggle('collapsed');
          row.classList.toggle('expanded');
        }
      } else if (previewable) {
        openPreview(item.path, item.name, ext);
      }
    });

    container.appendChild(row);

    // Children
    if (item.children && item.children.length > 0) {
      const childDiv = document.createElement('div');
      childDiv.className = 'tree-children';
      renderTree(item.children, childDiv, depth + 1);
      container.appendChild(childDiv);
    }

    parent.appendChild(container);
  }
}

function getIconSvg(item) {
  if (item.isDirectory) {

// ===== Preview Modal =====
function openPreview(filePath, fileName, ext) {
  currentFilePath = filePath;
  currentFileExt = ext;
  currentViewMode = 'preview';

  document.getElementById('modalTitle').textContent = fileName;
  document.getElementById('modalOverlay').style.display = 'flex';
  document.getElementById('modalDownload').href = '/api/file?path=' + encodeURIComponent(filePath) + '&token=' + TOKEN + '&dl=1';

  // Reset tabs
  document.querySelectorAll('.modal-tab').forEach((t, i) => t.classList.toggle('active', i === 0));

  const cat = getFileCategory(ext);
  const showTabs = cat === 'markdown' || cat === 'code';
  const isTextType = cat === 'markdown' || cat === 'code' || cat === 'text';
  document.getElementById('modalTabs').style.display = showTabs ? 'flex' : 'none';
  document.getElementById('modalCopyBtn').style.display = isTextType ? '' : 'none';

  const body = document.getElementById('modalBody');

  // Image
  if (cat === 'image') {
    body.innerHTML = '<img src="/api/file?path=' + encodeURIComponent(filePath) + '&token=' + TOKEN + '" alt="' + escHtml(fileName) + '" style="max-width:100%;max-height:65vh;display:block;margin:0 auto">';
    return;
  }
  // Audio
  if (cat === 'audio') {
    body.innerHTML = '<div style="text-align:center;padding:20px"><p style="margin-bottom:16px;font-weight:500">' + escHtml(fileName) + '</p><audio controls autoplay style="width:100%;max-width:500px"><source src="/api/file?path=' + encodeURIComponent(filePath) + '&token=' + TOKEN + '"></audio></div>';
    return;
  }
  // Video
  if (cat === 'video') {
    body.innerHTML = '<video controls autoplay style="width:100%;max-height:55vh;display:block"><source src="/api/file?path=' + encodeURIComponent(filePath) + '&token=' + TOKEN + '"></video>';
    return;
  }

  // Text/code/markdown
    body.innerHTML = '<div class="empty-hint"><span>加载中...</span></div>';
  fetch('/api/file?path=' + encodeURIComponent(filePath) + '&token=' + TOKEN)
    .then(r => r.text())
    .then(text => {
      currentRawContent = text;
      renderPreview(text, ext);
    })
    .catch(err => {
      body.innerHTML = '<div class="empty-hint"><span style="color:var(--danger)">加载失败: ' + escHtml(err.message) + '</span></div>';
    });
}

function renderPreview(text, ext) {
  const body = document.getElementById('modalBody');
  const cat = getFileCategory(ext);

  if (currentViewMode === 'source') {
    const lines = text.split('\n');
    const pad = String(lines.length).length;
    const numbered = lines.map((l, i) => '<span style="color:var(--text3);user-select:none;margin-right:12px">' + String(i+1).padStart(pad,' ') + '</span>' + escHtml(l)).join('\n');
    body.innerHTML = '<pre style="white-space:pre-wrap;word-break:break-all">' + numbered + '</pre>';
    return;
  }

  if (cat === 'markdown') {
    body.innerHTML = '<div class="md-body">' + parseMarkdown(text) + '</div>';
    return;
  }

  // Code or text
  const highlighted = (cat === 'code') ? highlightCode(text, ext) : escHtml(text);
  body.innerHTML = '<pre>' + highlighted + '</pre>';
}

function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
  // Destroy media elements to stop playback
  document.getElementById('modalBody').innerHTML = '';
  currentFilePath = null;
  currentRawContent = '';
}

// ===== Simple Markdown Parser =====
function parseMarkdown(src) {
  let html = src.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Fenced code blocks
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code) {
    const h = lang ? highlightCode(code.trim(), lang) : escHtml(code.trim());
    return '<pre><code>' + h + '</code></pre>';
  });
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Headers
  html = html.replace(/^###### (.+)$/gm, '<h6>$1</h6>');
  html = html.replace(/^##### (.+)$/gm, '<h5>$1</h5>');
  html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // HR
  html = html.replace(/^(---|\*\*\*|___)\s*$/gm, '<hr>');
  // Bold / Italic
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/___(.+?)___/g, '<strong><em>$1</em></strong>');
  html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');
  html = html.replace(/_(.+?)_/g, '<em>$1</em>');
  // Images
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
  // Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // Blockquotes
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  html = html.replace(/<\/blockquote>\n<blockquote>/g, '<br>');
  // Unordered lists
  html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
  // Paragraphs
  const lines = html.split('\n');
  const result = [];
  let inList = false;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith('<h') || line.startsWith('<hr') || line.startsWith('<pre') || line.startsWith('<blockquote') || line.startsWith('<table')) {
      if (inList) { result.push('</ul>'); inList = false; }
      result.push(line);
    } else if (line.startsWith('<li>')) {
      if (!inList) { result.push('<ul>'); inList = true; }
      result.push(line);
    } else if (line.trim() === '') {
      if (inList) { result.push('</ul>'); inList = false; }
      result.push('');
    } else if (line.trim()) {
      if (inList) { result.push('</ul>'); inList = false; }
      result.push('<p>' + line + '</p>');
    } else {
      result.push(line);
    }
  }
  if (inList) result.push('</ul>');
  return result.join('\n');
}

// ===== Code Highlighting =====
const KEYWORDS = {
  js: 'break case catch class const continue debugger default delete do else export extends finally for function if import in instanceof let new of return super switch this throw try typeof var void while with yield async await static get set from as'.split(' '),
  py: 'False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '),
  java: 'abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while'.split(' '),
  cpp: 'auto break case char const continue default do double else enum extern float for goto if int long register return short signed sizeof static struct switch typedef union unsigned void volatile while class namespace template typename virtual public private protected new delete try catch throw nullptr override final'.split(' '),
  go: 'break case chan const continue default defer else fallthrough for func go goto if import interface map package range return select struct switch type var'.split(' '),
  rs: 'as break const continue crate else enum extern false fn for if impl in let loop match mod move mut pub ref return self Self static struct super trait true type unsafe use where while async await dyn'.split(' '),
  sql: 'SELECT FROM WHERE AND OR NOT IN IS NULL LIKE BETWEEN JOIN INNER LEFT RIGHT OUTER ON AS ORDER BY GROUP HAVING LIMIT OFFSET INSERT INTO VALUES UPDATE SET DELETE CREATE TABLE DROP ALTER INDEX VIEW UNION ALL DISTINCT COUNT SUM AVG MIN MAX CASE WHEN THEN ELSE END EXISTS PRIMARY KEY FOREIGN REFERENCES CASCADE'.split(' ')
};
function highlightCode(code, lang) {
  const keywords = KEYWORDS[lang] || KEYWORDS['js'];
  const kwPattern = '\\b(' + keywords.join('|') + ')\\b';
  let html = escHtml(code);
  // Line comments
  if (['js','ts','jsx','tsx','go','rs','java','cpp','c','swift','kt','scala','dart','php'].includes(lang)) {
    html = html.replace(/(\/\/.*$)/gm, '<span class="hljs-comment">$1</span>');
  }
  if (['py','rb','sh','bash','yaml','toml'].includes(lang)) {
    html = html.replace(/(#.*$)/gm, '<span class="hljs-comment">$1</span>');
  }
  if (lang === 'sql') {
    html = html.replace(/(--.*$)/gm, '<span class="hljs-comment">$1</span>');
  }
  // Block comments
  html = html.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="hljs-comment">$1</span>');
  // Strings
  html = html.replace(/(["'`])(?:(?!\1|\\).|\\.)*\1/g, '<span class="hljs-string">$&</span>');
  // Numbers
  html = html.replace(/\b(\d+\.?\d*)\b/g, '<span class="hljs-number">$1</span>');
  // Keywords
  html = html.replace(new RegExp(kwPattern, 'gi'), '<span class="hljs-keyword">$1</span>');
  // Function calls
  html = html.replace(/\b([a-zA-Z_$][\w$]*)\(/g, '<span class="hljs-function">$1</span>(');
  return html;
}
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Clipboard helper (works on both HTTPS and HTTP)
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); return Promise.resolve(); }
  catch (e) { return Promise.reject(e); }
  finally { document.body.removeChild(ta); }
}

// Toast
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('webToast');
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); }, 2000);
}

// ===== Download & Bulk Actions =====
function downloadFile(filePath, fileName) {
  const a = document.createElement('a');
  a.href = '/api/file?path=' + encodeURIComponent(filePath) + '&token=' + TOKEN + '&dl=1';
  a.download = fileName;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function getCheckedFiles() {
  const cbs = document.querySelectorAll('.tree-cb:checked');
  const files = [];
  cbs.forEach(cb => {
    if (cb.dataset.path) files.push({ path: cb.dataset.path, name: cb.dataset.name });
  });
  return files;
}

function updateBulkBar() {
  const files = getCheckedFiles();
  document.getElementById('bulkCount').textContent = '已选择 ' + files.length;
  // Update select-all checkbox state
  const allCbs = document.querySelectorAll('.tree-cb[data-path]');
  const checkedCbs = document.querySelectorAll('.tree-cb[data-path]:checked');
  document.getElementById('selectAllCb').checked = allCbs.length > 0 && checkedCbs.length === allCbs.length;
  document.getElementById('selectAllCb').indeterminate = checkedCbs.length > 0 && checkedCbs.length < allCbs.length;
}

function selectAllFiles() {
  const checked = document.getElementById('selectAllCb').checked;
  document.querySelectorAll('.tree-cb[data-path]').forEach(cb => { cb.checked = checked; });
  updateBulkBar();
}

function downloadSelected() {
  const files = getCheckedFiles();
  if (files.length === 0) return;
  // Download files sequentially with a small delay
  files.forEach((f, i) => {
    setTimeout(() => downloadFile(f.path, f.name), i * 300);
  });
}

function downloadAllFiles() {
  document.querySelectorAll('.tree-cb[data-path]').forEach(cb => { cb.checked = true; });
  updateBulkBar();
  downloadSelected();
}

// Recursively collect all file paths under a directory item
function collectDirFiles(item, list) {
  if (!item.children) return;
  for (const child of item.children) {
    if (child.isDirectory) {
      collectDirFiles(child, list);
    } else {
      list.push({ path: child.path, name: child.name });
    }
  }
}

function downloadDir(item) {
  const files = [];
  collectDirFiles(item, files);
  if (files.length === 0) return;
  showToast('正在下载 ' + files.length + ' 个文件...');
  files.forEach((f, i) => {
    setTimeout(() => downloadFile(f.path, f.name), i * 300);
  });
}
